name: CI

on:
  # Branches are checked through their pull request; push covers master and tags,
  # so a push to a branch with an open PR does not run the jobs twice.
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Test the Spec Kit update checker
        run: python3 scripts/test_check_speckit_updates.py

      # Releases are X.Y.Z.0 from the tag; local builds raise only the fourth number.
      - name: Set the manifest version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}.0"
          node -e '
            const fs = require("node:fs");
            const file = "com.obalunenko.claudeperm.sdPlugin/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.Version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          ' "$version"

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: streamdeck-claude-plugin
          path: dist/streamdeck-claude-plugin.streamDeckPlugin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: streamdeck-claude-plugin
          path: dist

      - name: Release notes
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/streamdeck-claude-plugin.streamDeckPlugin
